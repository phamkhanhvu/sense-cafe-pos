<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sense POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<script>
/* Lớp kết nối dữ liệu: dùng MySQL trên hosting qua api.php (thay cho database của claude.ai) */
(function(){
  const API="api.php";
  async function call(body){
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),credentials:"same-origin"});
    if(!r.ok){ const e=new Error("api "+r.status); e.code=r.status===403?"invalid_argument":"api"; throw e; }
    return r.json();
  }
  const mkDoc=(id,data)=>({id,exists:true,data:()=>data});
  const subs=[]; let vers={}, timer=null, polling=false;
  function snapOf(res){ const docs=(res.docs||[]).map(d=>({id:d.id,data:()=>d.data})); return {docs,size:docs.length,forEach:f=>docs.forEach(f)}; }
  async function runSub(s){
    try{ const res=await s.fetch(); s.cb(res); }catch(e){ s.err&&s.err(e); }
  }
  async function poll(){
    if(polling) return; polling=true;
    try{
      const v=await call({op:"ver"});
      for(const s of subs){ const nv=v[s.col]||0; if(s.ver!==nv){ s.ver=nv; await runSub(s); } }
      vers=v;
    }catch(e){ subs.forEach(s=>s.err&&!s.warned&&(s.warned=true,s.err(e))); }
    polling=false;
  }
  function addSub(col,fetchFn,cb,err){
    const s={col,fetch:fetchFn,cb,err,ver:null,warned:false}; subs.push(s);
    (async()=>{ try{ const v=await call({op:"ver"}); s.ver=v[col]||0; }catch(e){} await runSub(s); })();
    if(!timer) timer=setInterval(poll,2500);
    return ()=>{ const i=subs.indexOf(s); if(i>=0) subs.splice(i,1); };
  }
  class Query{
    constructor(col,w,ob,lim){ this.col=col; this.w=w||[]; this.ob=ob||null; this.lim=lim||null; }
    where(f,o,v){ return new Query(this.col,[...this.w,[f,o,v]],this.ob,this.lim); }
    orderBy(f){ return new Query(this.col,this.w,f,this.lim); }
    limit(n){ return new Query(this.col,this.w,this.ob,n); }
    async get(){ const r=await call({op:"query",col:this.col,where:this.w,orderBy:this.ob,limit:this.lim||5000}); return snapOf(r); }
    onSnapshot(cb,err){ return addSub(this.col,()=>this.get(),cb,err); }
    doc(id){ return new DocRef(this.col,id); }
  }
  class DocRef{
    constructor(col,id){ this.col=col; this.id=id; }
    async get(){ const r=await call({op:"get",col:this.col,id:this.id}); return r.exists?mkDoc(this.id,r.data):{id:this.id,exists:false,data:()=>undefined}; }
    async set(data){ await call({op:"set",col:this.col,id:this.id,data}); setTimeout(poll,50); }
    async delete(){ await call({op:"del",col:this.col,id:this.id}); setTimeout(poll,50); }
    onSnapshot(cb,err){ return addSub(this.col,()=>this.get(),cb,err); }
  }
  const db={
    collection:c=>new Query(c),
    doc:p=>{ const [c,i]=p.split("/"); return new DocRef(c,i); }
  };
  const downloads={ async save({filename,data}){
    const ext=(filename.split(".").pop()||"").toLowerCase();
    const mime={html:"text/html",csv:"text/csv",json:"application/json",txt:"text/plain"}[ext]||"application/octet-stream";
    const blob=new Blob([data],{type:mime+";charset=utf-8"}); const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
  }};
  window.claude=window.claude||{};
  window.claude.use=async function(name){
    if(name==="db") return db;
    if(name==="downloads") return downloads;
    if(name==="user") return { isOwner:async()=>false, can:async()=>true };
    return null;
  };
})();
</script>

<style>
/* Sense POS: giao diện sáng, gọn. Nền xám sương, mực đen, vàng chanh lấy từ logo. Chỉ ô "chờ món" đổ đen để nổi bật, mọi thứ khác lặng và mảnh. */
:root{
  --bg:#f1f2ec; --surface:#ffffff; --surface-2:#e8eadf; --line:#e0e2d6;
  --fg:#14160f; --muted:#646a58; --accent:#14160f;
  --paper:#ffffff; --paper-2:#eef0e6; --on-dark:#c9e445; --lime:#c9e445;
  --s-open:#ffffff; --s-wait:#14160f; --s-extra:#2d5b78; --s-paid:#6a3c63; --s-serve:#2e6b3d; --s-move:#eef0e6; --s-closed:#e8eadf;
  --on-state:#ffffff; --on-wait:#c9e445; --danger:#b3261e; --good:#2e6b3d;
  --f-display:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --btn-line:#cdd0c2;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:var(--lime);color:var(--fg)}
.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 32px;max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand .logo{display:block;height:34px;width:auto;max-width:100%}
body.tv .brand .logo{height:clamp(48px,6vw,84px)}
.login .logo{display:block;width:min(260px,70%);height:auto;margin:0 0 10px}
.payov .logo{display:block;width:160px;height:auto;margin-bottom:6px}
.brand h1{font-weight:600;font-size:18px;margin:0;line-height:1.1}
.brand .sub{color:var(--muted);font-size:12px;padding-left:14px;border-left:1px solid var(--line)}
.clock{font-weight:500;font-size:18px;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.01em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 3px 3px 12px;color:var(--muted)}
.who b{font-weight:600;color:var(--fg)}
.who .small{color:var(--muted)}
.who button{padding:3px 10px;border-radius:999px;font-size:12px;background:var(--bg);border-color:transparent}
button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--btn-line);background:#fff;color:var(--fg);border-radius:8px;padding:6px 12px;font-weight:500;line-height:1.3;transition:background-color .15s,border-color .15s}
button:hover:not(:disabled){background:var(--bg);border-color:#b9bdab}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ghost{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:#b9bdab}
.ghost:hover:not(:disabled){background:transparent;border-color:transparent;color:var(--fg)}
.primary{background:var(--fg);color:#fff;border-color:var(--fg);padding:8px 18px}
.primary:hover:not(:disabled){background:#2b2f20;border-color:#2b2f20}
.danger{color:var(--danger)}
.note{font-size:12.5px;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.note.warn{border-left:3px solid var(--lime);padding-left:10px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.small{font-size:12px;color:var(--muted)}
.sep{height:1px;background:var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
select,input{font:inherit;font-size:13.5px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--fg);min-width:0}
input::placeholder{color:#9a9f8c;opacity:1}
.label{font-size:12.5px;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-weight:600;font-size:15px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:12px;align-items:start}
.err{color:var(--danger);font-size:12.5px;font-weight:600;min-height:1em}

/* Tabs */
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;border-radius:0;background:transparent;padding:8px 12px;white-space:nowrap;color:var(--muted);font-size:13.5px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button:hover:not(:disabled){background:transparent;color:var(--fg)}
nav.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
nav.tabs .badge{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--lime);color:var(--fg);font-size:11px;font-weight:600;text-align:center}

/* Login */
.login{max-width:560px;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px;width:100%;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.login h2{font-weight:600;font-size:22px;margin:0;line-height:1.15}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.people button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;text-align:left;border-radius:10px;background:var(--bg);border-color:transparent}
.people button b{font-size:15px;font-weight:600}
.people button[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.people button[aria-pressed="true"] .small{color:var(--lime)}
.pin{font-size:22px;letter-spacing:.5em;text-align:center;max-width:220px}

/* Queue strip */
.strip{display:flex;flex-direction:column;gap:8px}
.qhead{display:flex;align-items:center;gap:8px}
.qhead .label{font-size:13px;color:var(--fg)}
.qhead .count{font-weight:600;font-size:12px;background:var(--fg);color:var(--lime);border-radius:999px;min-width:22px;padding:1px 8px;text-align:center}
.qhead .count.ok{background:var(--s-serve);color:#fff}
.qlist{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.qitem{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 14px 7px 7px;text-align:left;font-weight:400}
.qitem:hover:not(:disabled){background:#fff;border-color:#b9bdab}
.qitem.first{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.qpos{font-weight:600;font-size:12.5px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--lime);flex:none}
.qitem.extra .qpos{background:var(--s-extra);color:#fff}
.qitem.paid .qpos{background:var(--s-paid);color:#fff}
.qname{font-weight:600;font-size:15px;line-height:1.15}
.qmeta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.qempty{color:var(--muted);padding:6px 0;font-size:13px}
.ready .qpos{background:var(--s-serve);color:#fff}

/* Table grid */
.zones{display:flex;flex-direction:column;gap:12px}
.zones > .label{font-size:13px;color:var(--fg);padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-height:88px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--s-open);color:var(--fg);text-align:left;font-weight:400}
.tile:hover:not(:disabled){background:inherit;border-color:#b9bdab}
.tile .num{font-weight:600;font-size:clamp(26px,2.6vw,32px);line-height:1;letter-spacing:-.01em}
.tile .lab{font-size:12px;font-weight:500}
.tile .time{font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums}
.tile .order{position:absolute;top:9px;right:9px;font-weight:600;font-size:11.5px;background:var(--fg);color:var(--lime);border-radius:999px;padding:0 8px;line-height:18px}
.tile .moved{position:absolute;bottom:9px;right:9px;font-size:10.5px;font-weight:600;background:var(--bg);color:var(--fg);border-radius:999px;padding:1px 7px}
.st-open{background:#fff}
.st-open .lab{color:var(--muted)}
.st-wait{background:var(--fg);color:#fff;border-color:var(--fg)}
.st-wait:hover:not(:disabled){border-color:#3a3f2c}
.st-wait .num{color:var(--on-wait)}
.st-wait .order{background:var(--lime);color:var(--fg)}
.st-extra{background:#e4edf3;border-color:#d3e1ea;box-shadow:inset 3px 0 0 var(--s-extra)}
.st-paid{background:#f2e7f0;border-color:#e6d3e3;box-shadow:inset 3px 0 0 var(--s-paid)}
.st-serve{background:#e6f0e3;border-color:#d4e5cf;box-shadow:inset 3px 0 0 var(--s-serve)}
.st-closed{background:repeating-linear-gradient(135deg,#eceee4 0 6px,#e4e6da 6px 12px);color:var(--muted);border-color:var(--line)}
.st-closed .num{text-decoration:line-through;text-decoration-thickness:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(20,22,15,.25)}

/* Kitchen */
.kbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:999px;padding:4px 12px;font-size:12.5px;background:#fff}
.chip[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-items:start}
.ticket{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.ticket.late{border-color:var(--danger)}
.ticket.late .thead{background:var(--danger);color:#fff}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 12px;background:var(--fg);color:#fff}
.thead .small{color:#c9cdbb}
.ticket.late .thead .small{color:#fbd5d1}
.thead b{font-size:16px;font-weight:600;color:#fff}
.tag{font-size:10.5px;font-weight:600;border-radius:999px;padding:1px 7px;background:var(--lime);color:var(--fg)}
.tline{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:9px 12px;text-align:left;background:transparent;font-weight:400;font-size:13.5px}
.tline:hover:not(:disabled){background:var(--bg);border-color:var(--line)}
.tline:last-child{border-bottom:0}
.tline .q{font-weight:600;font-size:15px;min-width:26px;font-variant-numeric:tabular-nums}
.tline .n{flex:1;min-width:0}
.tline .n strong{display:block;font-weight:600}
.tline .n em{font-style:normal;color:var(--danger);font-size:12px;font-weight:600}
.st{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;align-self:center;border:0}
.st-new{background:var(--paper-2);color:var(--fg)}
.st-making{background:var(--fg);color:var(--lime)}
.st-done{background:var(--s-serve);color:#fff}
.st-served{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--btn-line)}
.tfoot{padding:8px 12px 12px}
.tfoot button{width:100%}
.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--btn-line);border-radius:12px}

/* Menu editor */
.mgroup{display:flex;flex-direction:column;gap:6px}
.mgroup > .label{padding-bottom:6px;border-bottom:1px solid var(--line);font-size:13px;color:var(--fg)}
.mrow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.mrow .nm{min-width:0}
.mrow .nm strong{font-weight:600}
.mrow .money{font-weight:600;font-size:14px}
.mrow.off{opacity:.6}
.mrow.off .nm strong{text-decoration:line-through}
@media (max-width:520px){.mrow{grid-template-columns:1fr auto}.mrow .money{grid-column:2;grid-row:1}}

/* Numbers, tables, charts */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .small{font-size:12px}
.kpi b{font-weight:600;font-size:clamp(18px,2.2vw,24px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;letter-spacing:-.01em}
.kpi:first-child{background:var(--fg);border-color:var(--fg);color:#fff}
.kpi:first-child .small{color:#c9cdbb}
.kpi:first-child b{color:var(--lime)}
.kpi.neg b{color:var(--danger)}
.kpi.pos b{color:var(--good)}
.bills{display:flex;flex-direction:column;gap:6px}
.bills > .label{padding-bottom:6px;border-bottom:1px solid var(--line);font-size:13px;color:var(--fg)}
.bill{background:#fff;border:1px solid var(--line);border-radius:10px}
.bill.void{opacity:.6}
.bill.void summary strong{text-decoration:line-through}
.bill summary{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 12px;cursor:pointer;list-style:none}
.bill summary strong{font-weight:600;font-size:14px}
.bill summary::-webkit-details-marker{display:none}
.bill .lines{padding:0 12px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.ln{display:flex;justify-content:space-between;gap:10px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar .ln{font-size:13px}
.track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--fg)}
.scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--btn-line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.chart svg{display:block;width:100%;height:auto}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bar{fill:var(--fg)}
.chart .bar:hover{fill:#3a3f2c}
.chart .peak{fill:var(--fg);font-weight:600;font-size:12px}

.kkrow{display:grid;grid-template-columns:minmax(0,1fr) auto 96px 64px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.kkrow input{padding:6px 10px;text-align:right}
.kkname{font-weight:500;overflow-wrap:anywhere}
.kkbad{color:var(--danger);font-weight:600}
@media(max-width:520px){.kkrow{grid-template-columns:minmax(0,1fr) 84px 52px}.kkrow .small:nth-child(2){display:none}}
.denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.denoms label{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.denoms input{padding:5px 8px;text-align:right}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(20,22,15,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media(min-width:760px){.scrim{align-items:center;padding:24px}}
.sheet{--surface:#f1f2ec; --surface-2:#e8eadf; --line:#e0e2d6; --muted:#646a58;
  background:#fff;color:var(--fg);width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.sheet input,.sheet select{background:#fff}
.sheet .note{background:var(--surface);border-color:transparent}
.sheet.wide{max-width:800px}
@media(min-width:760px){.sheet{border-radius:16px}}
.sheet h3{margin:0;font-weight:600;font-size:20px;line-height:1.15}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts button{display:flex;align-items:center;gap:8px;justify-content:flex-start;padding:8px 12px;border-radius:8px;background:var(--surface);border-color:transparent;font-weight:500}
.acts button i{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(20,22,15,.25)}
.acts button.on{border-color:var(--fg)}
.cur{display:flex;flex-direction:column;gap:2px}
.cline{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cline .q{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.cline.billed{opacity:.55}
.cline .x{padding:3px 8px;font-size:12px}
.voidrow{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap}
.voidrow input{flex:1}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:16px;padding-top:6px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.pick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:10px;background:var(--surface);border-color:transparent;font-weight:600;font-size:13.5px}
.pick button span{font-weight:400;font-size:12px;color:var(--muted)}
.pick button:hover:not(:disabled){border-color:var(--fg);background:var(--surface)}
.cart{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:12px;padding:12px}
.citem{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:30px;height:30px;padding:0;font-size:16px;background:var(--fg);color:#fff;border-color:var(--fg);border-radius:8px}
.stepper button:hover:not(:disabled){background:#2b2f20}
.stepper output{min-width:24px;text-align:center;font-weight:600;font-size:14px}
.citem input{grid-column:1 / -1}
details.more summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500}
details.more[open] summary{margin-bottom:10px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pay button{border-radius:8px;background:var(--surface);border-color:transparent;padding:10px 6px}
.pay button[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.big{font-weight:600;font-size:30px;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.01em}
.chk{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.chk input{width:18px;height:18px;accent-color:#14160f}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:12px}
.qrbox svg{width:170px;height:170px;flex:none}
.qrbox .small{color:#555}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#fff;padding:10px 18px;border-radius:10px;font-weight:500;font-size:13px;z-index:40;max-width:calc(100% - 32px)}

/* TV payment overlay */
.payov{position:fixed;inset:0;z-index:30;background:rgba(20,22,15,.88);display:grid;place-items:center;padding:24px}
.payov .box{background:#fff;color:var(--fg);border-radius:20px;padding:28px 32px;display:flex;gap:32px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:100%}
.payov svg{width:min(44vh,360px);height:min(44vh,360px);border-radius:10px}
.payov .amt{font-weight:600;font-size:clamp(40px,6vw,72px);line-height:1;letter-spacing:-.02em}
.payov .t{font-weight:600;font-size:clamp(20px,2.6vw,30px);border-bottom:1px solid var(--line);padding-bottom:8px}

.opt{display:block;font-weight:600;font-size:12.5px;color:var(--fg)}
.optpanel{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px var(--fg)}
.optpanel .chip{background:#fff;border-color:var(--line)}
.optpanel .chip[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.extras{gap:10px}
.extras .stepper{gap:6px}
.choice-row{display:grid;grid-template-columns:2fr 1fr 2fr 1fr auto;gap:6px;align-items:center}
@media(max-width:620px){.choice-row{grid-template-columns:1fr 1fr}}
.tvbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px;margin-top:4px}
.tvbar > div{background:var(--fg);color:#fff;border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tvbar .label{color:var(--lime);font-size:12px}
.tvbar b{font-weight:600;font-size:clamp(20px,2.4vw,30px);line-height:1.1;overflow-wrap:anywhere}
.tvbar .small{color:#c9cdbb}
.tile.booked{box-shadow:inset 0 0 0 2px var(--fg)}
.song{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.song b{font-weight:600;font-size:15px}
.song.first{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
@media(max-width:520px){.song{grid-template-columns:auto 1fr}.song .row{grid-column:1 / -1}}
.booking{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.booking > div:first-child{min-width:0;flex:1}
.booking.st-b-cancel,.booking.st-b-noshow{opacity:.55}
.booking.st-b-arrived{box-shadow:inset 3px 0 0 var(--s-serve)}
.tbl tr.low td{color:var(--danger);font-weight:600}
.acts-cell{white-space:nowrap}
.acts-cell button{padding:3px 9px;font-size:12px;margin-left:4px}
.aiout{white-space:pre-wrap;line-height:1.6;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.aiout:empty{display:none}
body.tv nav.tabs, body.tv .hide-tv{display:none}
body.tv .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
body.tv .tile{min-height:120px;padding:14px 16px}
body.tv .tile .num{font-size:clamp(40px,4vw,56px)}
body.tv .tile .lab{font-size:14px}
body.tv .tile .time{font-size:13px}
body.tv .qname{font-size:22px}
body.tv .qpos{width:34px;height:34px;font-size:15px}
@media (max-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}.tile{min-height:78px;padding:8px 10px}.brand .sub{display:none}}
@media (prefers-reduced-motion:no-preference){.tile{transition:background-color .35s,border-color .2s}}

/* ================= VietQR (EMVCo payload, generated on this device) ================= */
function crc16(s){ let c=0xFFFF; for(const ch of s){ c^=ch.charCodeAt(0)<<8; for(let k=0;k<8;k++){ c=(c&0x8000)?((c<<1)^0x1021):(c<<1); c&=0xFFFF; } } return c.toString(16).toUpperCase().padStart(4,"0"); }
const tlv = (id,v) => id+pad(v.length)+v;
function vietqr(amount, desc){
  const mai = tlv("00","A000000727")+tlv("01", tlv("00",S.cafe.bankBin)+tlv("01",String(S.cafe.bankAcc).replace(/\s/g,"")))+tlv("02","QRIBFTTA");
  let s = tlv("00","01")+tlv("01", amount?"12":"11")+tlv("38",mai)+tlv("53","704")+(amount?tlv("54",String(Math.round(amount))):"")+tlv("58","VN");
  const d=ascii(desc).slice(0,25); if(d) s+=tlv("62",tlv("08",d));
  s+="6304"; return s+crc16(s);
}
function qrSvg(text){
  if(typeof qrcode!=="function") return null;
  const q=qrcode(0,"M"); q.addData(text); q.make();
  const n=q.getModuleCount(), m=2; let p="";
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) p+=`M${c+m} ${r+m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="Mã QR chuyển khoản"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`;
}

function handleWriteError(e){
  if(e && e.code==="invalid_argument"){ canWrite=false; showNote("Không có quyền ghi dữ liệu. Kiểm tra đăng nhập thư mục bảo vệ rồi tải lại trang."); render(); }
  else if(e && e.code==="quota_exceeded"){ showNote("Bộ nhớ dữ liệu đã đầy. Vào Cài đặt › Dữ liệu để lưu trữ các tháng cũ."); }
  else showNote("Chưa lưu được thay đổi. Kiểm tra mạng rồi thử lại.");
}
async function put(col, id, obj){
  const {id:_drop, ...body} = obj;
  S[col][id]={...body,id};
  render();
  if(local){ saveLocal(); return; }
  try{ await db.collection(col).doc(id).set(body); }catch(e){ handleWriteError(e); throw e; }
}
async function del(col, id){
  delete S[col][id]; render();

  try{ await db.collection(col).doc(id).delete(); }catch(e){ handleWriteError(e); }
}

/* ================= business logic ================= */
const busy = new Set();
async function setItemState(i, state){
  if(!state || busy.has(i.id) || !me) return; busy.add(i.id);
  try{ await quiet(put("items", i.id, {...i, state, [state+"At"]:Date.now()})); if(state==="served") await syncTable(i.tableId); }
  finally{ busy.delete(i.id); }
}
async function syncTable(tid){
  const t=S.tables[tid]; if(!t) return;
  const its=tableItems(tid);
  if(!its.length && STATES[t.status]?.queue) return quiet(put("tables", tid, {...t, status:"open", queuedAt:null, paid:false, movedFrom:null, changedAt:Date.now()}));
  if(its.length && its.every(x=>x.state==="served") && STATES[t.status]?.queue)
    return quiet(put("tables", tid, {...t, status:"serve", queuedAt:null, changedAt:Date.now()}));
}
async function voidItem(i, reason){
  await quiet(put("voids", uid(), {name:i.name, qty:i.qty, price:i.price, tableLabel:i.tableLabel, state:i.state, reason:reason||"", by:me.name, at:Date.now(), day:dayKey()}));
  await del("items", i.id);
  await syncTable(i.tableId);
  toast("Đã huỷ "+i.qty+"× "+i.name);
}
function billCode(d=new Date()){ return String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+"-"+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds()); }
async function clearTable(t){
  await Promise.all(tableItems(t.id).map(i=>del("items", i.id)));
  await quiet(put("tables", t.id, {...S.tables[t.id], status:"open", paid:false, queuedAt:null, movedFrom:null, guests:null, changedAt:Date.now()}));
}
async function moveTable(src, dst){
  const now=Date.now(), merging=tableItems(dst.id).length>0;
  await Promise.all(tableItems(src.id).map(i=>quiet(put("items", i.id, {...i, tableId:dst.id, tableLabel:dst.label}))));
  let status=src.status, queuedAt=src.queuedAt||null;
  if(merging){
    const its=tableItems(dst.id), pending=its.some(x=>x.state!=="served");
    const qs=[src.queuedAt,dst.queuedAt].filter(Boolean);
    status = pending ? (STATES[dst.status]?.queue?dst.status:"wait") : "serve";
    queuedAt = pending ? (qs.length?Math.min(...qs):now) : null;
  }
  const paid = tableItems(dst.id).length>0 && tableItems(dst.id).every(x=>x.billed);
  await quiet(put("tables", dst.id, {...S.tables[dst.id], status, queuedAt, paid, changedAt:now, movedFrom:src.label, guests:((merging?(S.tables[dst.id].guests||0):0)+(src.guests||0))||null}));
  await quiet(put("tables", src.id, {...S.tables[src.id], status:"open", paid:false, queuedAt:null, movedFrom:null, guests:null, changedAt:now}));
  carts[dst.id]=[...(carts[dst.id]||[]),...(carts[src.id]||[])]; delete carts[src.id];
}
function setStatus(t, s){
  const now=Date.now(), patch={status:s, changedAt:now};
  patch.queuedAt = STATES[s].queue ? ((STATES[t.status]?.queue && s!=="extra") ? (t.queuedAt||now) : now) : null;
  if(s==="open") patch.movedFrom=null;
  return quiet(put("tables", t.id, {...t, ...patch}));
}

async function saveFile(filename, data, okMsg){
  if(!downloads){ toast("Máy này chưa tải được file."); return false; }
  try{ await downloads.save({filename, data}); if(okMsg) toast(okMsg); return true; }
  catch(e){ if(e?.code!=="declined") toast("Không tải được file ("+(e?.code||"lỗi")+")."); return false; }
}
function printReceipt(b, draft){
  const html=receiptHtml(b,draft);
  try{
    const old=document.getElementById("printFrame"); if(old) old.remove();
    const f=document.createElement("iframe"); f.id="printFrame"; f.setAttribute("aria-hidden","true");
    f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
    f.srcdoc=html; document.body.append(f);
    setTimeout(()=>{ try{ f.remove(); }catch(e){} }, 120000);
    toast("Đang mở hộp thoại in…");
  }catch(e){
    const w=window.open("","_blank","width=420,height=700");
    if(w){ w.document.open(); w.document.write(html); w.document.close(); }
    else saveFile((draft?"tam-tinh-":"hoa-don-")+b.code+".html", html, "Mở file vừa tải để in");
  }
}

function render(){

  if(!render.reset){ V.querySelectorAll("input[id],select[id],textarea[id]").forEach(e=>{ keep[e.id]= e.type==="checkbox"? e.checked : e.value; }); const a=document.activeElement; if(a && V.contains(a) && a.id) focusId=a.id; }

const R={preset:"7d", from:null, to:null, data:null, loading:false, err:""};
function presetRange(p){
  const t=new Date(); t.setHours(0,0,0,0); const end=new Date(t); end.setDate(end.getDate()+1);
  if(p==="today") return [t,end];
  if(p==="yesterday"){ const a=new Date(t); a.setDate(a.getDate()-1); return [a,t]; }
  if(p==="7d"){ const a=new Date(t); a.setDate(a.getDate()-6); return [a,end]; }
  if(p==="30d"){ const a=new Date(t); a.setDate(a.getDate()-29); return [a,end]; }
  if(p==="month") return [new Date(t.getFullYear(),t.getMonth(),1), end];
  if(p==="lastmonth") return [new Date(t.getFullYear(),t.getMonth()-1,1), new Date(t.getFullYear(),t.getMonth(),1)];
  return [t,end];
}
async function fetchRange(col, fld, a, b, eq){
  if(local) return Object.values(S[col]||{}).filter(x=>x[fld]>=a && x[fld]<b && (!eq || x[eq[0]]===eq[1]));
  const out=[]; let from=a;
  for(let g=0; g<40; g++){
    let q=db.collection(col); if(eq) q=q.where(eq[0],"==",eq[1]);
    const s=await q.where(fld,">=",from).where(fld,"<",b).orderBy(fld).limit(1000).get();
    s.docs.forEach(d=>out.push({...d.data(),id:d.id}));
    if(s.size<1000) break; from=s.docs[s.size-1].data()[fld]+1;
  }
  return out;
}

function barChart(labels, values, opts={}){

  const mx=Math.max(1,...values), step=Math.pow(10,Math.floor(Math.log10(mx))), f=mx/step, nice=(f<=1?1:f<=2?2:f<=3?3:f<=4?4:f<=6?6:f<=8?8:10)*step;
  const bw=iw/n, peak=values.indexOf(Math.max(...values));
  let s=`<svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.round(W*.75)}px" role="img" aria-label="${esc(opts.title||"Biểu đồ")}">`;
  for(let k=0;k<=3;k++){ const val=nice*k/3, y=T+ih-ih*k/3; s+=`<line class="grid-l" x1="${L}" x2="${W-8}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${compact(val)}</text>`; }
  const every=Math.ceil(n/(opts.maxLabels||12));
  values.forEach((v,i)=>{
    const h=v?Math.max(2,ih*v/nice):0, x=L+i*bw+bw*.18, w=Math.max(2,bw*.64), y=T+ih-h, r=Math.min(4,w/2,h);
    if(h) s+=`<path class="bar" d="M${x} ${T+ih}V${y+r}q0 -${r} ${r} -${r}h${w-2*r}q${r} 0 ${r} ${r}V${T+ih}z"><title>${esc(labels[i])}: ${money(v)}</title></path>`;
    if(i%every===0) s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${esc(opts.short?opts.short(labels[i]):labels[i])}</text>`;
    if(i===peak && v) s+=`<text class="peak" x="${x+w/2}" y="${y-4}" text-anchor="middle">${compact(v)}</text>`;
  });
  return s+`</svg>`;
}

async function archiveOld(st, b){
  if(local){ st.textContent="Chế độ riêng máy này không cần lưu trữ."; return; }
  if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Bấm lần nữa để bắt đầu"; st.textContent="Hoá đơn chi tiết của các tháng trước tháng này sẽ được tổng hợp rồi xoá."; return; }
  b.disabled=true;
  const now=new Date(), cut=new Date(now.getFullYear(),now.getMonth(),1);
  try{
    const old=await fetchRange("bills","paidAt",0,+cut);
    const byMonth={}; old.forEach(x=>{ (byMonth[x.day.slice(0,7)] ||= []).push(x); });
    const months=Object.keys(byMonth).sort();
    if(!months.length){ st.textContent="Không có tháng cũ nào cần lưu trữ."; b.disabled=false; return; }
    for(const m of months){
      const arr=byMonth[m], prev=S.archive[m]||{days:{},items:{},cats:{},hours:Array(24).fill(0),staff:{}};
      const A={month:m, days:{...prev.days}, items:{...prev.items}, cats:{...prev.cats}, hours:[...(prev.hours||Array(24).fill(0))], staff:{...prev.staff}};
      arr.filter(x=>!x.void).forEach(x=>{
        const d=(A.days[x.day] ||= {rev:0,count:0,disc:0,cash:0,transfer:0,card:0}); d.rev+=x.total; d.count++; d.disc+=x.discount||0; d[x.method]=(d[x.method]||0)+x.total; d.cogs=(d.cogs||0)+(x.cogs||0); d.promo=(d.promo||0)+(x.promoDiscount||0); d.tips=(d.tips||0)+x.lines.filter(l=>l.cat==="Ủng hộ ca sĩ").reduce((t,l)=>t+l.qty*l.price,0);
        A.hours[x.hour ?? new Date(x.paidAt).getHours()]+=x.total;
        const sf=(A.staff[x.by||"?"] ||= {count:0,rev:0}); sf.count++; sf.rev+=x.total;
        x.lines.forEach(l=>{ const it=(A.items[l.name] ||= {qty:0,rev:0,cat:l.cat||""}); it.qty+=l.qty; it.rev+=l.qty*l.price; A.cats[l.cat||"Khác"]=(A.cats[l.cat||"Khác"]||0)+l.qty*l.price; });
      });
      await db.collection("archive").doc(m).set(A); S.archive[m]=A;
      let i=0; for(const x of arr){ await db.collection("bills").doc(x.id).delete(); if(++i%25===0) st.textContent="Tháng "+m+": đã dọn "+i+"/"+arr.length+" hoá đơn…"; }
    }
    try{ const old2=await fetchRange("songs","at",0,+cut); for(const x of old2) await db.collection("songs").doc(x.id).delete(); }catch(e){}
    st.textContent="Đã lưu trữ "+months.join(", ")+"."; b.textContent="Lưu trữ các tháng trước"; delete b.dataset.sure;
  }catch(e){ st.textContent="Dừng giữa chừng ("+(e?.code||"lỗi")+"). Bấm lại để làm tiếp, số liệu không bị tính trùng."; }
  b.disabled=false;
}

function promoActive(p, d=new Date()){
  if(p.active===false) return false;
  if(p.days?.length && !p.days.includes(d.getDay())) return false;
  if(p.from && p.to){ const t=pad(d.getHours())+":"+pad(d.getMinutes()); const inside = p.from<=p.to ? (t>=p.from && t<p.to) : (t>=p.from || t<p.to); if(!inside) return false; }
  const k=dayKey(d); if(p.dateFrom && k<p.dateFrom) return false; if(p.dateTo && k>p.dateTo) return false;
  return true;
}

    else if(p.kind==="bxgy"){
      const buy=p.buy||2, free=p.free||1, g=buy+free, units=[];
      el2.filter(i=>inCats(p,i)).forEach(i=>{ for(let k=0;k<i.qty;k++) units.push(i.price); });
      units.sort((a,b)=>b-a);
      for(let k=0;k<Math.floor(units.length/g);k++) for(let f=0;f<free;f++) amt+=units[k*g+buy+f];
    }
    else if(p.kind==="bill"){ const sub=sumItems(el2); if(sub>0 && sub>=(p.minTotal||0)) amt = p.percent ? sub*p.percent/100 : (p.amount||0); }
    amt=Math.round(amt/1000)*1000;
    if(amt>0) out.push({id:p.id,name:p.name,amount:amt});
  });
  return out;
}
function useOf(items){
  const use={};
  items.forEach(i=>{
    const m=S.menu[i.menuId];
    (m?.recipe||[]).forEach(r=>{ if(S.stock[r.s] && r.a) use[r.s]=(use[r.s]||0)+r.a*i.qty; });
    (i.opts||[]).forEach(o=>{ if(o.s && S.stock[o.s] && o.a) use[o.s]=(use[o.s]||0)+o.a*i.qty; });
  });
  return use;
}
const cogsOf = use => Object.entries(use||{}).reduce((s,[k,v])=>s+v*(S.stock[k]?.cost||0),0);
const recipeCost = m => (m.recipe||[]).reduce((s,r)=>s+(r.a||0)*(S.stock[r.s]?.cost||0),0);
const stockLow = s => (s.min||0)>0 && (s.qty||0)<=s.min;
const lowFor = m => (m.recipe||[]).some(r=>S.stock[r.s] && (S.stock[r.s].qty||0) < (r.a||0));
const loyOn = () => S.cafe.loyOn!==false;
const loyEarn = () => S.cafe.loyEarn||10000;
const loyValue = () => S.cafe.loyValue ?? 1000;

async function sendOrder(t, cart){
  const now=Date.now(), batch=uid(), had=tableItems(t.id).length>0;
  const kitchen=cart.filter(c=>c.station!=="none");
  await Promise.all(cart.map(c=>{ const auto=c.station==="none";
    return quiet(put("items", uid(), {tableId:t.id,tableLabel:t.label,menuId:c.menuId||"",name:c.name,cat:c.cat||"",price:c.price,qty:c.qty,opts:c.opts||[],note:c.note||"",station:c.station||"bar",state:auto?"served":"new",...(auto?{servedAt:now}:{}),at:now,day:dayKey(),batch,by:me.name,billed:false,cleared:false})); }));
  const cur=S.tables[t.id];
  if(kitchen.length) await quiet(put("tables", t.id, {...cur, status:(had && cur.status!=="open") ? "extra" : "wait", queuedAt:now, changedAt:now, paid:false}));
  else if(cur.status==="open") await quiet(put("tables", t.id, {...cur, status:"serve", changedAt:now}));
  toast("Đã gửi "+cart.reduce((s,c)=>s+c.qty,0)+" món của bàn "+t.label);
}
async function addDirect(t, name, cat, price, qty){
  const now=Date.now();
  await quiet(put("items",uid(),{tableId:t.id,tableLabel:t.label,menuId:"",name,cat,price,qty,opts:[],note:"",station:"none",state:"served",servedAt:now,at:now,day:dayKey(),batch:uid(),by:me.name,billed:false,cleared:false}));
  const cur=S.tables[t.id]; if(cur && cur.status==="open") await quiet(put("tables",t.id,{...cur,status:"serve",changedAt:now}));
}
async function checkout(t, its, c, method, given, cust){
  const now=Date.now(), d=new Date(now), sh=currentShift();
  const use=useOf(its), cogs=Math.round(cogsOf(use));
  const earned = cust && loyOn() && loyEarn()>0 ? Math.floor(c.total/loyEarn()) : 0;
  const bill={code:billCode(d), tableLabel:t.label, guests:t.guests||null,
    lines:its.map(i=>({name:i.name,opt:optLabel(i.opts),qty:i.qty,price:i.price,cat:i.cat||"",menuId:i.menuId||""})),
    subtotal:c.s, promos:c.promos, promoDiscount:c.promoAmt, manualDiscount:c.manual, pointsUsed:c.pts, pointsAmt:c.ptsAmt,
    discount:c.promoAmt+c.manual+c.ptsAmt, total:c.total, method, given:given||null, cogs, use,
    customer: cust?{phone:cust.phone,name:cust.name||""}:null, pointsEarned:earned,
    paidAt:now, day:dayKey(d), hour:d.getHours(), by:me.name, byId:me.id, shiftId:sh?sh.id:null, void:false};
  const id=uid();
  await quiet(put("bills", id, bill));
  await Promise.all(its.map(i=>quiet(put("items", i.id, {...i, billed:true}))));
  await applyStock(use, -1);
  if(cust) await applyLoyalty(cust, earned-(c.pts||0), c.total, 1);
  const all=tableItems(t.id), cur=S.tables[t.id];
  if(all.every(x=>x.state==="served") && all.every(x=>x.billed)) await clearTable(cur);
  else if(all.every(x=>x.billed)) await quiet(put("tables", t.id, {...cur, status: STATES[cur.status]?.queue ? "paid" : cur.status, paid:true, changedAt:now}));
  if(S.display?.active) putDisplay({active:false});
  return {...bill, id};
}
async function applyStock(use, sign){
  for(const [k,v] of Object.entries(use||{})){ const s=S.stock[k]; if(s) await quiet(put("stock",k,{...s, qty:Math.round(((s.qty||0)+sign*v)*100)/100})); }
}
async function applyLoyalty(cust, dPts, dSpent, dVisits){
  const k=phoneKey(cust.phone); if(!k) return;
  let cur=S.customers[k];
  if(!local){ try{ const g=await db.collection("customers").doc(k).get(); if(g.exists) cur={...g.data(),id:k}; }catch(e){} }
  const base=cur||{phone:k,name:"",points:0,visits:0,spent:0,created:Date.now()};
  const next={...base, phone:k, name:cust.name||base.name||"", birthday:cust.birthday||base.birthday||"",
    points:Math.max(0,(base.points||0)+dPts), visits:Math.max(0,(base.visits||0)+dVisits), spent:Math.max(0,(base.spent||0)+dSpent), ...(dVisits>0?{lastVisit:Date.now()}:{})};
  await quiet(put("customers", k, next));
}
async function voidBill(b, reason){
  await quiet(put("bills",b.id,{...b,void:true,voidBy:me.name,voidReason:reason||"",voidAt:Date.now()}));
  await applyStock(b.use, +1);
  if(b.customer) await applyLoyalty(b.customer, (b.pointsUsed||0)-(b.pointsEarned||0), -b.total, -1);
  toast("Đã huỷ hoá đơn "+b.code);
}

      const rows={}, st0=shiftStartMin(); HR.data.forEach(x=>{ const mins=x.out?(x.minutes ?? Math.round((x.out-x.in)/60000)):Math.round((Date.now()-x.in)/60000); const r=(rows[x.staffId] ||= {name:x.name,shifts:0,mins:0,pay:0,open:0,late:0}); r.shifts++; r.mins+=mins; { const di=new Date(x.in), base=new Date(di.getFullYear(),di.getMonth(),di.getDate()).getTime()+st0*60000; if(x.in>base) r.late+=Math.round((x.in-base)/60000); } r.pay+=mins/60*((S.staff[x.staffId]?.wage ?? x.wage)||0); if(!x.out) r.open++; });
      const t=el("table","tbl"); t.innerHTML=`<thead><tr><th>Nhân viên</th><th class="r">Số ca</th><th class="r">Giờ công</th><th class="r">Lương/giờ</th><th class="r">Thành tiền</th><th class="r">Trễ (phút)</th><th class="r">Thưởng</th><th class="r">Tổng nhận</th></tr></thead>`;
      const tb=el("tbody"); let tot=0;
      Object.entries(rows).sort((a,b)=>b[1].mins-a[1].mins).forEach(([id,r])=>{ const pay=Math.round(r.pay/1000)*1000; tot+=pay; const tr=el("tr"); tr.innerHTML=`<td>${esc(r.name)}${r.open?' <span class="small">(đang trong ca)</span>':""}</td><td class="r">${r.shifts}</td><td class="r">${(r.mins/60).toFixed(1).replace(".",",")}</td><td class="r">${money(S.staff[id]?.wage||0)}</td><td class="r">${money(pay)}</td><td class="r">${r.late||"–"}</td>`; const bn=HR.bonus?.[id]?.amount||0; const tdb=el("td","r"); tdb.append(document.createTextNode(bn?money(bn)+" ":"– ")); if(can("hr") && HR.preset!=="week") tdb.append(btn("Sửa","ghost",()=>openBonus(id,r.name,bn))); const tdt=el("td","r",money(pay+bn)); tr.append(tdb,tdt); tot+=bn; tb.append(tr); });
      if(!Object.keys(rows).length){ const tr=el("tr"); tr.innerHTML=`<td colspan="8" class="small">Chưa có dữ liệu chấm công trong kỳ.</td>`; tb.append(tr); }
      t.append(tb); const sc=el("div","scroll"); sc.append(t);
      c.append(sc, el("div","small","Tổng lương tạm tính (gồm thưởng): "+money(tot)+". Trễ tính từ giờ vào ca chuẩn "+(cafeShiftStart())+" (đổi ở khung bên trên). Đặt lương theo giờ ở Cài đặt › Nhân viên."));
      const d=el("details","more"); d.append(el("summary",null,"Chi tiết từng ca, sửa giờ nếu quên chấm"));
      HR.data.slice().sort((a,b)=>b.in-a.in).forEach(x=>{ const r=el("div","ln"); r.append(el("span","small",x.name+" · "+new Date(x.in).toLocaleDateString("vi-VN")+" "+hm(x.in)+"–"+(x.out?hm(x.out):"đang làm")+(x.edited?" · đã sửa bởi "+x.editedBy:"")), btn("Sửa","ghost",()=>openTsEdit(x))); d.append(r); });
      c.append(d, btn("Xuất bảng công (CSV)","",()=>{ const rws=[["Nhân viên","Ngày","Vào","Ra","Số phút","Lương/giờ","Thành tiền"]]; HR.data.slice().sort((a,b)=>a.in-b.in).forEach(x=>{ const m=x.out?Math.round((x.out-x.in)/60000):""; const w=S.staff[x.staffId]?.wage||x.wage||0; rws.push([x.name,new Date(x.in).toLocaleDateString("vi-VN"),hm(x.in),x.out?hm(x.out):"",m,w,m?Math.round(m/60*w):""]); }); saveFile("bang-cong-"+dayKey()+".csv", csv(rws), "Đã xuất bảng công"); }));
    }
    cards.append(c); }
  v.append(cards);
}
function openTsEdit(x){
  sheetKind="ts"; const sh=$("#sheet"); sh.className="sheet"; sh.innerHTML="";
  sh.append(Object.assign(el("h3",null,"Sửa ca · "+x.name),{id:"sheetTitle"}));
  const a=inp("tsIn",null,dtLocal(x.in)); a.type="datetime-local"; const b=inp("tsOut",null,x.out?dtLocal(x.out):""); b.type="datetime-local";
  const f=el("div","fields"); f.append(field("Giờ vào",a), field("Giờ ra",b)); const err=el("div","err"); sh.append(f, err);

    const nx={...x,in:i,out:o,minutes:o?Math.round((o-i)/60000):null,day:dayKey(new Date(i)),edited:true,editedBy:me.name};
    closeSheet(); await quiet(put("timesheets",x.id,nx)); if(HR.data){ const k=HR.data.findIndex(z=>z.id===x.id); if(k>=0) HR.data[k]=nx; } render(); toast("Đã sửa ca"); }),
    btn("Huỷ","ghost",closeSheet));
  const sp=el("span"); sp.style.flex="1"; row.append(sp, btn("Xoá ca","ghost danger",async()=>{ closeSheet(); await del("timesheets",x.id); if(HR.data) HR.data=HR.data.filter(z=>z.id!==x.id); render(); }));
  sh.append(row); $("#scrim").hidden=false;
}

  const pack=X=>X&&{doanh_thu:X.rev,so_hoa_don:X.count,tb_moi_hoa_don:X.count?Math.round(X.rev/X.count):0,giam_gia:X.disc,khuyen_mai:X.promo,gia_von:X.cogs,chi:X.exp,
    theo_hinh_thuc:X.byMethod,theo_gio:Object.fromEntries(X.byHour.map((v,h)=>[h+"h",v]).filter(x=>x[1])),theo_ngay:X.byDay,
    mon_ban_chay:Object.entries(X.items).sort((a,b)=>b[1].rev-a[1].rev).slice(0,10).map(([n,x])=>({mon:n,sl:x.qty,dt:x.rev})),theo_nhom:X.cats,thu_ngan:X.staff,hoa_don_huy:X.voidCount,mon_huy:X.itemVoids,ung_ho_ca_si:X.tips};
  const shows=(D.shows||[]).map(s=>({ngay:s.date,gio:s.start,ca_si:s.artist,doanh_thu_ngay:A.byDay[s.date]||0}));
  const slow=Object.values(S.menu).filter(m=>!A.items[m.name]).map(m=>m.name);
  const prompt=`Bạn là trợ lý quản lý cho quán cà phê acoustic "${S.cafe.name||"Sense coffee & acoustic"}" ở Đà Lạt. Dưới đây là số liệu bán hàng (đơn vị đồng) của kỳ hiện tại (${dayKey(D.a)} đến ${dayKey(new Date(+D.b-1))}) và kỳ trước có cùng độ dài.
Viết nhận xét bằng tiếng Việt, ngắn gọn, tối đa 12 dòng, chia 3 phần với tiêu đề viết hoa: TÌNH HÌNH, ĐIỂM ĐÁNG CHÚ Ý, NÊN LÀM. Mỗi ý một dòng bắt đầu bằng "- ". So sánh với kỳ trước bằng số và phần trăm cụ thể. Chỉ dùng số có trong dữ liệu, không bịa. Gợi ý hành động thực tế cho một quán nhỏ: menu, giờ cao điểm, khuyến mãi, đêm nhạc, nhân sự. Không dùng markdown in đậm hay in nghiêng.

KỲ HIỆN TẠI: ${JSON.stringify(pack(A))}
KỲ TRƯỚC: ${JSON.stringify(pack(P)||"không có dữ liệu")}
ĐÊM NHẠC TRONG KỲ: ${JSON.stringify(shows)}
MÓN KHÔNG BÁN ĐƯỢC TRONG KỲ: ${JSON.stringify(slow.slice(0,20))}`;
  out.textContent="Claude đang đọc số liệu…";
  try{ const r=await sample(prompt,{onText:({text})=>{ out.textContent=text; }}); out.textContent=r.text; }

}

  db.doc("config/sepay").onSnapshot(s=>{ S.sepay=s.exists?s.data():{}; if(view==="caidat") render(); }, ()=>{});

      db.collection("bills").where("day","==",today).onSnapshot(s=>{ S.bills=toMap(s); render(); }, onErr),
      db.collection("expenses").where("day","==",today).onSnapshot(s=>{ S.expenses=toMap(s); render(); }, onErr),
